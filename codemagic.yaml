workflows:
  tendies-unlock:
    name: Tendies Unlock - IPA chua ky
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: "26.3"
    scripts:
      - name: Giai nen source
        script: |
          set -euo pipefail
          unzip -q TendiesUnlock-iOS-source.zip -d extracted
          test -f extracted/tendies-ios/scripts/build-ipa.sh
      - name: Build IPA
        script: |
          set -euo pipefail
          cd extracted/tendies-ios
          bash scripts/build-ipa.sh
    artifacts:
      - extracted/tendies-ios/build/TendiesUnlock-unsigned.ipa

  tendies-vn:
    name: TendiesVN - IPA chua ky
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: "26.3"
    scripts:
      - name: Giai nen source
        script: |
          set -euo pipefail
          unzip -q TendiesVN-source.zip -d extracted
          test -f extracted/TendiesVN/scripts/build-unsigned.sh
      - name: Build IPA
        script: |
          set -euo pipefail
          cd extracted/TendiesVN
          bash scripts/build-unsigned.sh
    artifacts:
      - extracted/TendiesVN/build/1809-unsigned.ipa
      - extracted/TendiesVN/build/xcodebuild.log
