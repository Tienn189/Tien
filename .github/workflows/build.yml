name: Build IPA from ZIP
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Extract source and build
        run: |
          ditto -x -k TendiesVN-source.zip "$RUNNER_TEMP/tendiesvn"
          sed -i '' 's/lipo -verify_arch arm64 \(.*\)/lipo \1 -verify_arch arm64/' "$RUNNER_TEMP/tendiesvn/TendiesVN/scripts/build-unsigned.sh"
          find "$RUNNER_TEMP/tendiesvn" -type f -name '*.swift' -exec sed -i '' 's/allowedContentTypes: \[\.tendiesPackage, \.data\]/allowedContentTypes: [.item]/' {} +
          bash "$RUNNER_TEMP/tendiesvn/TendiesVN/scripts/build-unsigned.sh"
      - uses: actions/upload-artifact@v4
        with:
          name: TendiesVN-unsigned
          path: ${{ runner.temp }}/tendiesvn/TendiesVN/build/TendiesVN-unsigned.ipa
          if-no-files-found: error